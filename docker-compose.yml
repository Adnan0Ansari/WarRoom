# Dev:   docker compose up -d mongo redis      (then run server and client with npm)
# Full:  docker compose up --build              (everything in containers, app on http://localhost:8080)
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
  server:
    build: ./server
    restart: unless-stopped
    depends_on: [mongo, redis]
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/warroom
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-this-to-a-long-random-string}
      CLIENT_ORIGIN: http://localhost:8080
      APP_URL: http://localhost:8080
      API_PUBLIC_URL: http://localhost:8080
      SEED_DEMO: "true"
    profiles: ["full"]
  client:
    build: ./client
    restart: unless-stopped
    depends_on: [server]
    ports: ["8080:80"]
    profiles: ["full"]
volumes:
  mongo-data:
  redis-data:
