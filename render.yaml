# Render Blueprint: one web service (app + API + WebSocket) and one Redis-compatible Key Value store.
# MongoDB comes from MongoDB Atlas; you paste its connection string when Render asks.
services:
  - type: web
    name: tidewater
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tidewater-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED_DEMO
        value: "true"
      - key: ESC_SECONDS
        value: "20,40,60,90"

  - type: keyvalue
    name: tidewater-redis
    plan: free
    maxmemoryPolicy: noeviction # BullMQ job queues must never lose keys
    ipAllowList: [] # private network only
